# Release: 打 companion-v* tag 时发布 npm 包 + Docker 镜像（ghcr.io + Docker Hub）
#
# 触发：git push tag companion-vX.Y.Z
# - publish-npm：幂等，若该版本已在 npm registry 则跳过（兼容「先手动发再推 tag」）
# - publish-docker：构建 web / companion 双镜像，推 ghcr.io 和 docker.io 双 registry
#
# 所需 secrets（仓库 Settings → Actions）：
# - NPM_TOKEN          npm publish token（scope @honlnk）
# - DOCKERHUB_USERNAME  Docker Hub 账号
# - DOCKERHUB_TOKEN     Docker Hub Access Token（读写）
# GITHUB_TOKEN 由 Actions 自动注入，用于推送 ghcr.io。

name: Release

on:
  push:
    tags:
      - "companion-v*"

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: 发布 npm 包（幂等）
  # ─────────────────────────────────────────────────────────────────────────
  publish-npm:
    name: Publish npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm --provenance 需要
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#companion-v}" >> "$GITHUB_OUTPUT"

      - name: Skip if version already published
        id: skip
        run: |
          set -e
          if npm view "@honlnk/image-studio-companion@${{ steps.ver.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::npm @honlnk/image-studio-companion@${{ steps.ver.outputs.version }} 已存在，跳过发布"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.skip.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        if: steps.skip.outputs.exists != 'true'
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        if: steps.skip.outputs.exists != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build companion
        if: steps.skip.outputs.exists != 'true'
        run: pnpm --filter @honlnk/image-studio-companion build

      - name: Publish
        if: steps.skip.outputs.exists != 'true'
        working-directory: companion
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: 构建并推送 Docker 镜像（web + companion，ghcr + dockerhub）
  # ─────────────────────────────────────────────────────────────────────────
  publish-docker:
    name: Publish Docker (${{ matrix.target }})
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推送 ghcr.io 需要
    strategy:
      fail-fast: false
      matrix:
        target: [web, companion]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#companion-v}" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/honlnk/gpt-image-studio-${{ matrix.target }}:${{ steps.ver.outputs.version }}
            ghcr.io/honlnk/gpt-image-studio-${{ matrix.target }}:latest
            docker.io/honlnk/gpt-image-studio-${{ matrix.target }}:${{ steps.ver.outputs.version }}
            docker.io/honlnk/gpt-image-studio-${{ matrix.target }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
