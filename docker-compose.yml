# GPT Image Studio — Docker Compose
#
# Default profile: web frontend only (nginx static hosting).
# Users open http://localhost:8080 and use "直连模式" (direct mode) with their
# own OpenAI-compatible Images API base URL + key. No backend needed.
#
# Optional `companion` profile: runs the Companion backend as a sidecar.
# Companion 现已支持可配置监听地址（阶段三 PR1），可绑定 0.0.0.0 供容器外访问。
# 启用方式：docker compose --profile companion up

services:
  web:
    build:
      context: .
      target: web
    image: gpt-image-studio:latest
    container_name: gpt-image-studio-web
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

  # --- Optional companion backend (enable with --profile companion) ---
  companion:
    profiles: ["companion"]
    build:
      context: .
      target: companion
    image: gpt-image-studio-companion:latest
    container_name: gpt-image-studio-companion
    ports:
      - "19750:19750"
    volumes:
      # 持久化 SQLite master db + 业务 db + 图片 + 凭据
      - companion-data:/data
    environment:
      # PR1 阶段：仍是 local 行为（accessKey 信任模型），但可远程访问
      # PR2 起 server 模式接入 JWT_SECRET / ADMIN_API_KEY 等
      - GPT_IMAGE_STUDIO_CONFIG_DIR=/data
    restart: unless-stopped
    # 监听 0.0.0.0 让宿主浏览器可通过 http://localhost:19750 访问
    # 如需让宿主前端（http://localhost:8080）跨域访问 Companion，加 --allow-origin
    command: ["node", "dist/main.js", "serve", "--host", "0.0.0.0", "--port", "19750", "--allow-origin", "http://localhost:8080"]

volumes:
  companion-data:
