    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "GPT Image Studio 是什么？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "GPT Image Studio 是一个本地优先的 AI 图片创作工作台，通过聊天式界面调用 OpenAI 兼容 Images API 生成和编辑图片。支持文生图、图生图、遮罩局部编辑，所有数据保存在浏览器本地。"
          }
        },
        {
          "@type": "Question",
          "name": "数据存储在哪里？是否安全？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "浏览器直连模式下，所有数据（聊天记录、图片、设置）保存在浏览器 IndexedDB 中，不上传到任何服务器。Companion 模式下数据保存在本机 SQLite 中。API key 不写入备份导出文件。"
          }
        },
        {
          "@type": "Question",
          "name": "需要后端服务吗？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "不需要。浏览器直连模式完全在浏览器中运行，无需后端。如需保护 API 凭据或多人共用，可选接入本地 Companion 服务或部署为服务器模式。"
          }
        },
        {
          "@type": "Question",
          "name": "支持哪些 AI 图像生成模型？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "浏览器直连模式支持任何 OpenAI 兼容 Images API。Companion 模式支持 9 个 Provider：OpenAI、GLM（智谱）、豆包/火山方舟 Seedream、Qwen-Image（通义万相）、Wan、Grok、Gemini、Gemini-OpenAI 和 DeepInfra。"
          }
        },
        {
          "@type": "Question",
          "name": "Can I use GPT Image Studio offline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The web app requires an internet connection to call image generation APIs, but all your data (conversations, images, settings) is stored locally in your browser. The desktop app (Tauri) can work with local Companion for a fully self-contained experience."
          }
        }
      ]
    }
    </script>

    <!-- 启动画面关键样式：必须 inline——要在外部 CSS/JS bundle 加载完成前就生效 -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 38%, #1c2333 0%, #0f1420 75%);
      }
      #app-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      #app-splash svg {
        animation: splash-breathe 1.8s ease-in-out infinite;
      }
      #app-splash .splash-title {
        color: #f9fafb;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.04em;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #app-splash .splash-tagline {
        color: #9ca3af;
        font-size: 13px;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      @keyframes splash-breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.88;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash svg {
          animation: none;
        }
      }
    </style>
